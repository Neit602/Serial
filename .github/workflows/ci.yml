name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_COLOR: "1"

jobs:
  lint:
    name: ruff + mypy (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install project
        run: uv sync --extra dev --python ${{ matrix.python-version }}

      - name: ruff (lint)
        run: uv run ruff check .

      - name: ruff (format)
        run: uv run ruff format --check .

      - name: mypy --strict
        run: uv run mypy

  test:
    name: pytest (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install project
        run: uv sync --extra dev --python ${{ matrix.python-version }}

      # socat gives the integration tests a real pair of virtual serial ports.
      # It is unavailable on Windows, where those tests skip themselves.
      # The Qt runtime libraries are what PySide6 needs to start even headless.
      - name: Install socat and the Qt runtime (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y socat \
            libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xfixes0

      - name: Install socat (macOS)
        if: runner.os == 'macOS'
        run: brew install socat

      # COLUMNS/LINES keep Textual's headless pilot deterministic across runners;
      # QT_QPA_PLATFORM runs the Qt GUI tests without a display.
      - name: pytest
        run: uv run pytest -ra --durations=10
        env:
          COLUMNS: "120"
          LINES: "40"
          QT_QPA_PLATFORM: offscreen

      - name: Confirm the GUI tier actually ran
        run: uv run pytest -m gui --collect-only -q
        env:
          QT_QPA_PLATFORM: offscreen

      - name: Confirm the integration tier actually ran (POSIX)
        if: runner.os != 'Windows'
        run: uv run pytest -m socat --collect-only -q

      - name: Smoke-test the console script
        run: |
          uv run portside --version
          uv run portside --list
          uv run portside --list --json
          uv run portside profiles list

      # The TUI needs a terminal; piped I/O must still fall back to raw mode.
      - name: Smoke-test raw pass-through over loop://
        run: uv run python -c "import subprocess,sys; p=subprocess.run([sys.executable,'-m','portside','connect','loop://','--baud','115200','--quiet','--drain','0.5'],input=b'hello\r',capture_output=True,timeout=60); assert p.returncode==0, p; assert p.stdout==b'hello\r', p.stdout; print('raw pass-through ok')"
