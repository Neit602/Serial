name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  QT_VERSION: "6.8.3"

jobs:
  build-and-test:
    name: build + test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          modules: qtserialport
          cache: true

      - name: Install Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5

      # socat gives the integration tests a real pair of virtual serial ports;
      # it is unavailable on Windows, where those tests skip themselves.  The
      # font and GL libraries are what Qt needs to render even headless.
      - name: Install socat and runtime libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y socat libgl1 libegl1 libxkbcommon0 libfontconfig1 fonts-dejavu-core

      - name: Install socat (macOS)
        if: runner.os == 'macOS'
        run: brew install socat

      - name: Set up MSVC (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure
        shell: bash
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DPORTSIDE_WARNINGS_AS_ERRORS=${{ runner.os == 'Linux' && 'ON' || 'OFF' }}

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure --timeout 300

      - name: Confirm the GUI and integration tiers ran
        shell: bash
        run: |
          ctest --test-dir build -L gui -N | grep -q "Total Tests: 5"
          ctest --test-dir build -L socat -N | grep -q "Total Tests: 1"

      - name: Smoke-test the command line
        shell: bash
        run: |
          build/src/cli/portside --version
          build/src/cli/portside --list
          build/src/cli/portside --list --json
          build/src/cli/portside profiles list
          # Piped input selects byte-exact pass-through; loop:// echoes it.
          out=$(printf 'hello\r' | build/src/cli/portside connect loop:// --baud 115200 --quiet --drain 0.5 | od -An -c | tr -s ' ')
          echo "got: $out"
          test "$out" = " h e l l o \r"

  sanitizers:
    name: AddressSanitizer + UBSan (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          modules: qtserialport
          cache: true

      - name: Install Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Install socat and runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y socat libgl1 libegl1 libxkbcommon0 libfontconfig1 fonts-dejavu-core

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=0
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir build --output-on-failure --timeout 600
